# Reverse proxy from the host-published port to the internal-only api service.
server {
    listen 80;
    server_tokens off;

    # api/routes/ask.py accepts uploads up to 20MB.
    client_max_body_size 25m;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /ask/stream is newline-delimited JSON: pass each event straight through.
        proxy_buffering off;
        proxy_cache off;
        # Local CPU models can take minutes to draft an answer.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
